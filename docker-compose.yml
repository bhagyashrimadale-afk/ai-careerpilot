version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=ai-careerpilot-super-secret-key-2026-production-ready-32bytes
      - JWT_SECRET_KEY=jwt-careerpilot-secret-key-2026-production-ready-32bytes
      - PORT=5000
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always

services:
  - type: web
    name: ai-careerpilot-api
    env: python
    region: oregon
    buildCommand: "pip install -r requirements.txt && python seed.py"
    startCommand: "gunicorn run:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
